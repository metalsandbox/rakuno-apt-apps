name: Build and publish APT repository
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag (empty = latest stable)'
        default: ''
        type: string
      revision:
        description: 'Debian packaging revision'
        default: '1'
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-apt
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore previously published packages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            mkdir repo
            git archive FETCH_HEAD | tar -x -C repo
          fi
      - name: Build verified upstream binaries into Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.tag }}
          PACKAGING_REVISION: ${{ inputs.revision || '1' }}
        run: python3 scripts/build.py --tag "$UPSTREAM_TAG" --revision "$PACKAGING_REVISION"
      - name: Build pinned Xperia Flashtool for Debian 13 amd64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-flashtool.py
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from build import index; index()'
      - name: Verify Debian 13 dependencies and GUI in disposable container
        run: |
          docker run --rm -v "$PWD:/work:ro" debian:trixie sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends /work/repo/pool/main/x/xperia-flashtool/*_amd64.deb xvfb xauth
            /usr/lib/xperia-flashtool/jre/bin/java -version
            useradd -m tester
            set +e
            timeout 30s su -s /bin/sh tester -c "xvfb-run -a xperia-flashtool" > /tmp/gui.log 2>&1
            result=$?
            set -e
            cat /tmp/gui.log
            test "$result" = 124
            ! grep -E "UnsatisfiedLinkError|NoClassDefFoundError|Exception in thread|SWTError|Libusb not found" /tmp/gui.log
            test -d /home/tester/.flashTool/devices/C69XX
            grep -q "gitauto=false" /home/tester/.flashTool/config.properties
          '
      - name: Sign APT metadata
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GNUPGHOME: ${{ runner.temp }}/apt-signing
        run: |
          test -n "$APT_SIGNING_KEY"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          sh scripts/sign.sh
      - name: Remove temporary private key
        if: always()
        run: rm -rf "${{ runner.temp }}/apt-signing"
      - name: Verify packages and APT using isolated state
        run: python3 scripts/verify.py
      - name: Preserve repository and old versions on gh-pages
        run: |
          cd repo
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          TREE=$(git write-tree)
          if git -C .. rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            PARENT=$(git -C .. rev-parse FETCH_HEAD)
            git fetch ../ "$PARENT"
            COMMIT=$(printf 'Publish signed APT repository\n' | git commit-tree "$TREE" -p "$PARENT")
          else
            COMMIT=$(printf 'Publish signed APT repository\n' | git commit-tree "$TREE")
          fi
          git remote add origin https://github.com/${{ github.repository }}.git
          git -c http.extraheader="$(git -C .. config --get http.https://github.com/.extraheader)" push origin "$COMMIT":refs/heads/gh-pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: repo
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify published HTTPS source using Debian 13 APT
        run: |
          docker run --rm -v "$PWD/keys:/keys:ro" debian:trixie sh -ec '
            # Bootstrap HTTPS trust from Debian using its already trusted source.
            apt-get update
            apt-get download ca-certificates
            dpkg-deb -x ca-certificates*.deb /tmp/certs
            cat /tmp/certs/usr/share/ca-certificates/mozilla/*.crt > /tmp/ca-certificates.crt
            printf "%s\n" "deb [arch=amd64 signed-by=/keys/rakuno-apt-apps.gpg] https://metalsandbox.github.io/rakuno-apt-apps stable main" > /etc/apt/sources.list.d/rakuno.list
            apt-get -o Acquire::https::CaInfo=/tmp/ca-certificates.crt -o APT::Update::Error-Mode=any update
            apt-cache policy xperia-flashtool
            apt-get -s install xperia-flashtool
            apt-get -o Acquire::https::CaInfo=/tmp/ca-certificates.crt download xperia-flashtool
            dpkg-deb -f xperia-flashtool*.deb Version | grep -Fx 0.9.36.0-1rakuno1
          '
